name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm from `packageManager`, Node.js from `.nvmrc`, then runs
      # `pnpm install --frozen-lockfile` (whose `prepare` script patches
      # TypeScript and Oxlint with the Effect integration).
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
